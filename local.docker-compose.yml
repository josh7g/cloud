services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: semgrep_analysis
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - 9876:5432
    volumes:
      - semgrep_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    ports:
      - 9379:6379
    command: redis-server --appendonly yes
    volumes:
      - semgrep_redis_data:/data

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - 8081:80
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  semgrep_postgres_data:
  semgrep_redis_data:
  pgadmin_data:
    